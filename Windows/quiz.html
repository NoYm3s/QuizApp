<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp - Тест: Изобретения и открытия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        .title-bar {
            background: #f5f5f7;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }
        .traffic-lights { display: flex; gap: 8px; }
        .traffic-light { width: 12px; height: 12px; border-radius: 50%; }
        .traffic-light.red { background: #ff5f57; }
        .traffic-light.yellow { background: #febc2e; }
        .traffic-light.green { background: #28c840; }
        .title-text { flex: 1; text-align: center; font-size: 15px; font-weight: 600; color: #1d1d1f; margin-right: 52px; }
        .header { padding: 20px 30px; background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .question-counter { font-size: 14px; opacity: 0.9; }
        .score { font-size: 18px; font-weight: bold; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; }
        .progress-container { background: rgba(255,255,255,0.3); border-radius: 10px; height: 8px; overflow: hidden; }
        .progress-bar { background: white; height: 100%; border-radius: 10px; transition: width 0.3s ease; }
        .content { padding: 30px; }
        .question-box { background: #f9fafb; border-radius: 15px; padding: 25px; margin-bottom: 25px; border-left: 4px solid #3b82f6; }
        .question-label { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .question-text { font-size: 18px; font-weight: 600; color: #1d1d1f; line-height: 1.5; }
        .answers-label { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .answers { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .answer-btn {
            background: white; border: 2px solid #e5e7eb; border-radius: 12px; padding: 18px 20px;
            font-size: 15px; color: #1d1d1f; cursor: pointer; transition: all 0.2s ease;
            text-align: left; line-height: 1.5; width: 100%;
        }
        .answer-btn:hover:not(:disabled) { border-color: #3b82f6; background: #eff6ff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.15); }
        .answer-btn:disabled { cursor: not-allowed; }
        .answer-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .answer-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .next-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; border: none;
            border-radius: 12px; padding: 16px 30px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s ease;
        }
        .next-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.3); }
        .next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .results { text-align: center; padding: 50px 30px; }
        .results-icon { font-size: 80px; margin-bottom: 20px; }
        .results-title { font-size: 32px; font-weight: bold; color: #1d1d1f; margin-bottom: 30px; }
        .results-stats { background: #f9fafb; border-radius: 15px; padding: 25px; margin-bottom: 30px; }
        .stat-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { font-size: 16px; color: #6b7280; }
        .stat-value { font-size: 18px; font-weight: bold; color: #1d1d1f; }
        .results-message { font-size: 22px; font-weight: 600; margin-bottom: 30px; padding: 20px; border-radius: 15px; }
        .results-message.excellent { background: #dcfce7; color: #166534; }
        .results-message.good { background: #dbeafe; color: #1e40af; }
        .results-message.ok { background: #fef3c7; color: #92400e; }
        .results-message.bad { background: #fee2e2; color: #991b1b; }
        .restart-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; border: none;
            border-radius: 12px; padding: 16px 40px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.3); }
        .hidden { display: none; }
        .lang-switch {
            position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.2);
            padding: 5px 12px; border-radius: 8px; color: white; cursor: pointer; border: none; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="title-bar">
            <div class="traffic-lights">
                <div class="traffic-light red"></div>
                <div class="traffic-light yellow"></div>
                <div class="traffic-light green"></div>
            </div>
            <div class="title-text">📝 QuizApp</div>
        </div>
        <div id="quiz-screen">
            <div class="header" style="position:relative;">
                <button class="lang-switch" onclick="toggleLang()">🇷🇺 RU / 🇬🇧 EN</button>
                <div class="header-top">
                    <div class="question-counter" id="counter">Вопрос 1 из 35</div>
                    <div class="score" id="score">Счёт: 0</div>
                </div>
                <div class="progress-container"><div class="progress-bar" id="progress" style="width:2.8%"></div></div>
            </div>
            <div class="content">
                <div class="question-box">
                    <div class="question-label" id="q-label">Вопрос</div>
                    <div class="question-text" id="question-text"></div>
                </div>
                <div class="answers-label" id="a-label">Варианты ответа</div>
                <div class="answers" id="answers"></div>
                <button class="next-btn" id="next-btn" disabled onclick="nextQuestion()">Следующий вопрос →</button>
            </div>
        </div>
        <div id="results-screen" class="hidden">
            <div class="results">
                <div class="results-icon">🎉</div>
                <div class="results-title" id="res-title">Тест завершён!</div>
                <div class="results-stats">
                    <div class="stat-row"><span class="stat-label" id="res-correct">Правильных ответов:</span><span class="stat-value" id="result-score"></span></div>
                    <div class="stat-row"><span class="stat-label" id="res-percent">Процент:</span><span class="stat-value" id="result-percent"></span></div>
                </div>
                <div class="results-message" id="result-message"></div>
                <button class="restart-btn" onclick="restartQuiz()">🔄 Пройти заново</button>
            </div>
        </div>
    </div>

    <script>
        let lang = 'ru';
        const i18n = {
            ru: { qLabel: 'Вопрос', aLabel: 'Варианты ответа', next: 'Следующий вопрос →', showRes: 'Показать результат', counter: 'Вопрос', score: 'Счёт', title: 'Тест завершён!', correct: 'Правильных ответов:', percent: 'Процент:', restart: '🔄 Пройти заново', excellent: 'Отлично! Ты готов к контрольной! 🌟', good: 'Хорошо! Ещё немного повторить! 👍', ok: 'Неплохо, но стоит подучить! 📚', bad: 'Нужно ещё подготовиться! 💪' },
            en: { qLabel: 'Question', aLabel: 'Answer Options', next: 'Next question →', showRes: 'Show results', counter: 'Question', score: 'Score', title: 'Quiz Complete!', correct: 'Correct answers:', percent: 'Percentage:', restart: '🔄 Restart', excellent: 'Excellent! You\'re ready! 🌟', good: 'Good! A bit more practice! 👍', ok: 'Not bad, keep studying! 📚', bad: 'Need more preparation! 💪' }
        };

        const QUESTIONS = [
            {q:"What was revolutionary about Gutenberg's concept? How long had the printing press stayed unchanged?",c:"The revolutionary part was the movable type system using individual metal characters. The mechanics remained unchanged for 300 years.",w:["Gutenberg invented the steam engine which revolutionized printing for 200 years.","He created the first paper-making machine that lasted 150 years without changes.","The revolutionary concept was using colored ink, unchanged for 250 years."]},
            {q:"Why did the early printing presses wear down quickly?",c:"They required great force to operate, which caused the wood to crack and the metal type to wear down over time.",w:["The ink was too acidic and corroded the metal parts within months.","Workers didn't know how to operate them properly and broke them intentionally.","The humidity in printing rooms caused rapid rusting of all metal components."]},
            {q:"Who is recognized as the inventor of the electric light bulb? What key elements led to the triumph of his version?",c:"Thomas Edison is credited because his version was more practical due to effective materials, a higher vacuum, and high resistance.",w:["Nikola Tesla invented it first using alternating current and special filaments.","Benjamin Franklin created it with static electricity and glass insulation.","Alexander Graham Bell invented it while working on telephone technology."]},
            {q:"What breakthrough was made by the Wright brothers?",c:"They invented the first airplane and achieved the first sustained, controlled flight in 1903.",w:["They invented the first hot air balloon and flew over the Atlantic in 1900.","They created the first helicopter and flew it across France in 1905.","They built the first jet engine and tested it during World War I."]},
            {q:"What contraptions preceded the first airplane invented by the Wright brothers?",c:"Human flight was previously attempted with kites, balloons, and gliders.",w:["People tried flying using mechanical wings attached to bicycles and cars.","Early attempts included rocket-powered sleds and parachute-equipped horses.","The main predecessors were steam-powered ornithopters and hot air rockets."]},
            {q:"What do you know about the invention made by Joseph Nicéphore Niépce?",c:"He created a prototype of a photographic camera in 1816 and took the oldest surviving photograph in 1826.",w:["He invented the first color photography process in 1850 using natural dyes.","He created the first motion picture camera and filmed a short movie in 1830.","He developed the first digital camera prototype in 1840 using metal plates."]},
            {q:"What breakthrough in the automotive industry was made by Carl Benz?",c:"He patented a gas-powered engine for his car, which led to the creation of the Mercedes-Benz enterprise.",w:["He invented the first electric car battery that could run for 100 miles.","He created the first rubber tire and sold it to all European car manufacturers.","He designed the first steering wheel system still used in modern cars today."]},
            {q:"What was Henry Ford's contribution to the development of the automotive industry?",c:"He utilized mass-production techniques, specifically the assembly line, making cars affordable for the general public.",w:["He invented the first gasoline engine that was twice as powerful as competitors'.","He created the first luxury car brand that only rich people could afford.","He designed the first car with air conditioning and automatic transmission."]},
            {q:"Who was Alexander Graham Bell? What did he invent?",c:"He was a scientist and inventor who created the telephone.",w:["He was a musician who invented the first electric guitar and amplifier.","He was a doctor who invented the first stethoscope for heart monitoring.","He was a sailor who invented the first submarine communication device."]},
            {q:"Why is the date March 10th, 1876, important?",c:"It was the day of the first successful telephone transmission, where Bell spoke the first words to his assistant, Mr. Watson.",w:["It was when the first telegraph message was sent across the Atlantic Ocean.","It marked the patent filing date for the first radio broadcasting system.","It was the day the first electric light bulb was demonstrated publicly."]},
            {q:"What is Alfred Nobel famous for? What is his most prominent invention?",c:"He is famous for establishing the Nobel Prize. His most prominent invention was dynamite.",w:["He invented the first steam locomotive and founded the Nobel Railway Company.","He created the first electric generator and established the Energy Prize.","He discovered penicillin and left his fortune for medical research awards."]},
            {q:"How was the Nobel Prize established?",c:"It was established through the will of Alfred Nobel, who left his fortune in a trust to fund the awards.",w:["The Swedish Parliament created it to honor the greatest scientists of each century.","It was founded by a group of wealthy industrialists in memory of Nobel.","The United Nations established it using donations from Nobel's family members."]},
            {q:"Describe the selection process for the Nobel Prize winners.",c:"Winners are selected for making outstanding contributions or discoveries in their fields during the preceding year.",w:["Winners are chosen by popular vote from people around the world each December.","A computer algorithm selects winners based on the number of citations they have.","Winners must nominate themselves and present their work to a public jury."]},
            {q:"What fields is the Nobel Prize awarded in?",c:"Physics, Chemistry, Medicine (Physiology), Literature, Economics, and Peace.",w:["Mathematics, Biology, Engineering, Art, Music, and International Relations.","Physics, Sports, Cooking, Fashion, Technology, and Environmental Protection.","Medicine, Architecture, Film, Dance, Philosophy, and Human Rights."]},
            {q:"What is the maximum number of laureates that can receive a single award, and what is the exception?",c:"The maximum is three individuals. The exception is the Peace Prize, which can be awarded to entire organizations.",w:["The maximum is five people, with no exceptions for any category.","Only one person can win per category, but organizations can win two categories.","The maximum is ten people, and the Literature Prize can go to publishing houses."]},
            {q:"What are some examples of famous Nobel laureates mentioned in the video?",c:"Ernest Hemingway (Literature), Alexander Fleming (Medicine), Albert Einstein (Physics), and Marie Curie (Physics and Chemistry).",w:["William Shakespeare (Literature), Louis Pasteur (Medicine), Isaac Newton (Physics).","Mark Twain (Literature), Charles Darwin (Medicine), Galileo Galilei (Physics).","Oscar Wilde (Literature), Sigmund Freud (Medicine), Stephen Hawking (Physics)."]},
            {q:"What is Alan Turing famous for?",c:"He is a pioneer of computer science who helped break the Enigma code and laid the foundation for AI and modern computing.",w:["He invented the first internet protocol and created the World Wide Web.","He was the first person to walk on the moon and designed space computers.","He discovered electricity and invented the first electric power plant."]},
            {q:"What does the concept of the Turing Machine refer to?",c:"It is a theoretical model that defines how computers process information using algorithms.",w:["It is a physical machine that can predict the future using mathematical calculations.","It refers to a special typewriter that could encode and decode secret messages.","It is a robot that can play chess better than any human in the world."]},
            {q:"What is the Turing Test?",c:"A test that measures a machine's ability to exhibit intelligent behavior indistinguishable from a human.",w:["A test that measures how fast a computer can solve mathematical equations.","A security test used to verify that a user is human and not a robot online.","A test that determines the IQ level of artificial intelligence systems."]},
            {q:"What do you know about the Turing Award?",c:"It is called the 'Nobel Prize of Computing' and is awarded by the ACM for groundbreaking contributions to computer science.",w:["It is given to the best video game developers by the Gaming Association annually.","It rewards the fastest programmers in competitive coding championships worldwide.","It is an award for the most beautiful website design on the internet each year."]},
            {q:"What do you know about the creation of the original recipe for the Coca-Cola drink and the shroud of mystery around it?",c:"It was created by John Pemberton in 1886. The 'mystery' is largely a marketing strategy used to generate attention.",w:["It was discovered by accident in a laboratory in 1900 by a French chemist.","The recipe was brought from Italy by immigrants in the 1700s and kept secret.","It was invented by a pharmacist in London and sold to Americans in 1920."]},
            {q:"Where is the Coca-Cola formula kept now? What security measures protect it?",c:"It is kept in a high-tech vault at the World of Coca-Cola in Atlanta, protected by palm scanners, code pads, and thick steel doors.",w:["It is stored in a Swiss bank vault with armed guards watching it 24/7.","The formula is memorized by three people and never written down anywhere.","It is kept in a underground bunker in Washington with military protection."]},
            {q:"What is the purpose of creating a shroud of mystery around the Coca-Cola formula?",c:"To create a brand legend that generates curiosity and keeps the product famous.",w:["To prevent competitors from copying the recipe which changes every month.","Because the ingredients are actually dangerous and need to be hidden from public.","To comply with government regulations about food industry trade secrets."]},
            {q:"What was the industrial revolution in the USA based on according to the text?",c:"It was founded on intellectual property smuggled out of England.",w:["It was based on inventions created entirely by American scientists from scratch.","It started when the USA imported all its machinery from France and Germany.","It was funded by wealthy investors who bought patents from Asian countries."]},
            {q:"How did the invention of the water-powered spinning frame change the country's industrial sector?",c:"It increased the production of cotton goods tenfold and led to the creation of many new factories.",w:["It replaced all manual labor with robots and eliminated the need for workers.","It was used only for making silk and had no impact on the cotton industry.","It decreased production but improved the quality of handmade goods significantly."]},
            {q:"What laws did the British Parliament pass in 1774 to protect the country's industrial secrets?",c:"They passed laws prohibiting engineers and mechanics from traveling abroad.",w:["They banned the export of all British-made machinery to foreign countries.","They imposed heavy taxes on anyone who shared industrial knowledge verbally.","They required all factory workers to sign lifetime confidentiality agreements."]},
            {q:"How did the technology of the water frame appear in the USA?",c:"Samuel Slater memorized the plans and sailed to America in 1789 to rebuild the machine there.",w:["The British government sold the blueprints to American businessmen for gold.","An American spy stole the actual machine and shipped it in pieces to Boston.","The technology was independently invented by American engineers from scratch."]},
            {q:"What is the Rhode Island System?",c:"A model for factory life that included tenements for workers and a company store built around the mill.",w:["A banking system created to fund industrial development in the northeastern states.","A transportation network connecting all major factories via railroads in Rhode Island.","An education program teaching workers how to operate machinery safely and efficiently."]},
            {q:"What did Samuel Slater and Francis Lowell have in common?",c:"Both memorized industrial plans in England and 'stole' them to start successful manufacturing industries in the USA.",w:["Both were British citizens who legally sold their inventions to the American government.","Both invented the steam engine and founded railway companies in the United States.","Both worked for the British Parliament and shared secrets with American diplomats."]},
            {q:"What does *know-how* refer to?",c:"It refers to practical knowledge or expertise on how to do something effectively, especially in technology or business.",w:["It is a legal term meaning the ownership of patented inventions and designs.","It refers to knowing who to contact in order to get information about anything.","It means having a university degree in engineering or business administration."]},
            {q:"Why is it important to take all advertisement with a grain of salt?",c:"Because advertisements are often based on exaggerated claims or 'shrouds of mystery' designed purely for marketing.",w:["Because all advertisements are illegal and should be ignored by consumers.","Because companies are required by law to lie in their advertising campaigns.","Because advertisements always contain hidden messages that control your mind."]},
            {q:"What is the purpose of smuggling? Why does it still exist today?",c:"The purpose is to gain illegal access to restricted goods or secrets for profit. It exists because of high demand and the desire for competitive advantages.",w:["Smuggling is only about transporting people across borders for tourism purposes.","It exists because governments want to test their border security systems regularly.","The purpose is to help poor countries get technology from wealthy nations freely."]},
            {q:"What is the brain drain and why does it happen?",c:"It is the emigration of highly trained or intelligent people from a particular country, usually due to better job opportunities or living conditions elsewhere.",w:["It is a medical condition where people lose memory after moving to a new country.","It refers to the loss of data when computers are transported across borders.","It happens when a country's education system stops producing qualified graduates."]},
            {q:"What are trade secrets?",c:"Confidential business information (like the Coke formula or Google's search algorithms) that provides an edge over competitors.",w:["They are government documents classified as top secret and hidden from the public.","Trade secrets are special products sold only in international trade markets.","They refer to the secret handshake used by businessmen to recognize each other."]},
            {q:"Name Top Russian inventions that changed the world.",c:"Common examples include the Periodic Table (Mendeleev), Radio (Popov), and the First Satellite/Sputnik (Korolev).",w:["The steam engine (Lomonosov), the telephone (Pavlov), and the Internet (Yandex).","The light bulb (Kurchatov), the airplane (Gagarin), and penicillin (Mechnikov).","The computer (Vavilov), the laser (Landau), and the World Wide Web (Runet)."]}
        ];

        let currentIndex = 0, score = 0, answered = false, shuffledQuestions = [], currentAnswers = [];

        function shuffleArray(arr) { const s = [...arr]; for (let i = s.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [s[i], s[j]] = [s[j], s[i]]; } return s; }
        function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; updateUI(); }
        function updateUI() {
            const t = i18n[lang];
            document.getElementById('q-label').textContent = t.qLabel;
            document.getElementById('a-label').textContent = t.aLabel;
            document.getElementById('counter').textContent = `${t.counter} ${currentIndex + 1} из ${shuffledQuestions.length}`;
            document.getElementById('score').textContent = `${t.score}: ${score}`;
            document.getElementById('next-btn').textContent = currentIndex < shuffledQuestions.length - 1 ? t.next : t.showRes;
            document.getElementById('res-title').textContent = t.title;
            document.getElementById('res-correct').textContent = t.correct;
            document.getElementById('res-percent').textContent = t.percent;
            document.querySelector('.restart-btn').textContent = t.restart;
        }
        function initQuiz() { shuffledQuestions = shuffleArray(QUESTIONS); currentIndex = 0; score = 0; loadQuestion(); }
        function loadQuestion() {
            answered = false; document.getElementById('next-btn').disabled = true;
            const q = shuffledQuestions[currentIndex];
            document.getElementById('question-text').textContent = q.q;
            currentAnswers = shuffleArray([...q.w, q.c]);
            const container = document.getElementById('answers'); container.innerHTML = '';
            currentAnswers.forEach((answer, index) => {
                const btn = document.createElement('button'); btn.className = 'answer-btn'; btn.textContent = answer;
                btn.onclick = () => selectAnswer(index); container.appendChild(btn);
            });
            updateUI();
            const progress = ((currentIndex + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }
        function selectAnswer(index) {
            if (answered) return; answered = true;
            const q = shuffledQuestions[currentIndex]; const selected = currentAnswers[index];
            const isCorrect = selected === q.c; if (isCorrect) score++;
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (currentAnswers[i] === q.c) btn.classList.add('correct');
                else if (i === index && !isCorrect) btn.classList.add('wrong');
            });
            document.getElementById('score').textContent = `${i18n[lang].score}: ${score}`;
            document.getElementById('next-btn').disabled = false;
        }
        function nextQuestion() {
            if (currentIndex < shuffledQuestions.length - 1) { currentIndex++; loadQuestion(); }
            else { document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('results-screen').classList.remove('hidden'); showResults(); }
        }
        function showResults() {
            const pct = Math.round((score / shuffledQuestions.length) * 100);
            document.getElementById('result-score').textContent = `${score} / ${shuffledQuestions.length}`;
            document.getElementById('result-percent').textContent = `${pct}%`;
            const t = i18n[lang]; let msg, cls;
            if (pct >= 90) { msg = t.excellent; cls = 'excellent'; }
            else if (pct >= 70) { msg = t.good; cls = 'good'; }
            else if (pct >= 50) { msg = t.ok; cls = 'ok'; }
            else { msg = t.bad; cls = 'bad'; }
            const msgEl = document.getElementById('result-message'); msgEl.textContent = msg; msgEl.className = 'results-message ' + cls;
        }
        function restartQuiz() { document.getElementById('results-screen').classList.add('hidden'); document.getElementById('quiz-screen').classList.remove('hidden'); initQuiz(); }
        initQuiz();
    </script>
</body>
</html>
