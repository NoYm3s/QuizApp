<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp - Тест: Изобретения и открытия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        .title-bar {
            background: #f5f5f7;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }
        .traffic-lights { display: flex; gap: 8px; }
        .traffic-light { width: 12px; height: 12px; border-radius: 50%; }
        .traffic-light.red { background: #ff5f57; }
        .traffic-light.yellow { background: #febc2e; }
        .traffic-light.green { background: #28c840; }
        .title-text { flex: 1; text-align: center; font-size: 15px; font-weight: 600; color: #1d1d1f; margin-right: 52px; }
        .header { padding: 20px 30px; background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .question-counter { font-size: 14px; opacity: 0.9; }
        .score { font-size: 18px; font-weight: bold; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; }
        .progress-container { background: rgba(255,255,255,0.3); border-radius: 10px; height: 8px; overflow: hidden; }
        .progress-bar { background: white; height: 100%; border-radius: 10px; transition: width 0.3s ease; }
        .content { padding: 30px; }
        .question-box { background: #f9fafb; border-radius: 15px; padding: 25px; margin-bottom: 25px; border-left: 4px solid #3b82f6; }
        .question-label { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .question-text { font-size: 18px; font-weight: 600; color: #1d1d1f; line-height: 1.5; }
        .answers-label { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .answers { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .answer-btn {
            background: white; border: 2px solid #e5e7eb; border-radius: 12px; padding: 18px 20px;
            font-size: 15px; color: #1d1d1f; cursor: pointer; transition: all 0.2s ease;
            text-align: left; line-height: 1.5; width: 100%;
        }
        .answer-btn:hover:not(:disabled) { border-color: #3b82f6; background: #eff6ff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.15); }
        .answer-btn:disabled { cursor: not-allowed; }
        .answer-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .answer-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .next-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; border: none;
            border-radius: 12px; padding: 16px 30px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s ease;
        }
        .next-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.3); }
        .next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .results { text-align: center; padding: 50px 30px; }
        .results-icon { font-size: 80px; margin-bottom: 20px; }
        .results-title { font-size: 32px; font-weight: bold; color: #1d1d1f; margin-bottom: 30px; }
        .results-stats { background: #f9fafb; border-radius: 15px; padding: 25px; margin-bottom: 30px; }
        .stat-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { font-size: 16px; color: #6b7280; }
        .stat-value { font-size: 18px; font-weight: bold; color: #1d1d1f; }
        .results-message { font-size: 22px; font-weight: 600; margin-bottom: 30px; padding: 20px; border-radius: 15px; }
        .results-message.excellent { background: #dcfce7; color: #166534; }
        .results-message.good { background: #dbeafe; color: #1e40af; }
        .results-message.ok { background: #fef3c7; color: #92400e; }
        .results-message.bad { background: #fee2e2; color: #991b1b; }
        .restart-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; border: none;
            border-radius: 12px; padding: 16px 40px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.3); }
        .hidden { display: none; }
        .lang-switch {
            position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.2);
            padding: 5px 12px; border-radius: 8px; color: white; cursor: pointer; border: none; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="title-bar">
            <div class="traffic-lights">
                <div class="traffic-light red"></div>
                <div class="traffic-light yellow"></div>
                <div class="traffic-light green"></div>
            </div>
            <div class="title-text">📝 QuizApp</div>
        </div>
        <div id="quiz-screen">
            <div class="header" style="position:relative;">
                <button class="lang-switch" onclick="toggleLang()">🇷🇺 RU / 🇬🇧 EN</button>
                <div class="header-top">
                    <div class="question-counter" id="counter">Вопрос 1 из 35</div>
                    <div class="score" id="score">Счёт: 0</div>
                </div>
                <div class="progress-container"><div class="progress-bar" id="progress" style="width:2.8%"></div></div>
            </div>
            <div class="content">
                <div class="question-box">
                    <div class="question-label" id="q-label">Вопрос</div>
                    <div class="question-text" id="question-text"></div>
                </div>
                <div class="answers-label" id="a-label">Варианты ответа</div>
                <div class="answers" id="answers"></div>
                <button class="next-btn" id="next-btn" disabled onclick="nextQuestion()">Следующий вопрос →</button>
            </div>
        </div>
        <div id="results-screen" class="hidden">
            <div class="results">
                <div class="results-icon">🎉</div>
                <div class="results-title" id="res-title">Тест завершён!</div>
                <div class="results-stats">
                    <div class="stat-row"><span class="stat-label" id="res-correct">Правильных ответов:</span><span class="stat-value" id="result-score"></span></div>
                    <div class="stat-row"><span class="stat-label" id="res-percent">Процент:</span><span class="stat-value" id="result-percent"></span></div>
                </div>
                <div class="results-message" id="result-message"></div>
                <button class="restart-btn" onclick="restartQuiz()">🔄 Пройти заново</button>
            </div>
        </div>
    </div>

    <script>
        let lang = 'ru';
        const i18n = {
            ru: { qLabel: 'Вопрос', aLabel: 'Варианты ответа', next: 'Следующий вопрос →', showRes: 'Показать результат', counter: 'Вопрос', score: 'Счёт', title: 'Тест завершён!', correct: 'Правильных ответов:', percent: 'Процент:', restart: '🔄 Пройти заново', excellent: 'Отлично! Ты готов к контрольной! 🌟', good: 'Хорошо! Ещё немного повторить! 👍', ok: 'Неплохо, но стоит подучить! 📚', bad: 'Нужно ещё подготовиться! 💪' },
            en: { qLabel: 'Question', aLabel: 'Answer Options', next: 'Next question →', showRes: 'Show results', counter: 'Question', score: 'Score', title: 'Quiz Complete!', correct: 'Correct answers:', percent: 'Percentage:', restart: '🔄 Restart', excellent: 'Excellent! You\'re ready! 🌟', good: 'Good! A bit more practice! 👍', ok: 'Not bad, keep studying! 📚', bad: 'Need more preparation! 💪' }
        };

        const QUESTIONS = [];

        let currentIndex = 0, score = 0, answered = false, shuffledQuestions = [], currentAnswers = [];

        function shuffleArray(arr) { const s = [...arr]; for (let i = s.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [s[i], s[j]] = [s[j], s[i]]; } return s; }
        function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; updateUI(); }
        function updateUI() {
            const t = i18n[lang];
            document.getElementById('q-label').textContent = t.qLabel;
            document.getElementById('a-label').textContent = t.aLabel;
            document.getElementById('counter').textContent = `${t.counter} ${currentIndex + 1} из ${shuffledQuestions.length}`;
            document.getElementById('score').textContent = `${t.score}: ${score}`;
            document.getElementById('next-btn').textContent = currentIndex < shuffledQuestions.length - 1 ? t.next : t.showRes;
            document.getElementById('res-title').textContent = t.title;
            document.getElementById('res-correct').textContent = t.correct;
            document.getElementById('res-percent').textContent = t.percent;
            document.querySelector('.restart-btn').textContent = t.restart;
        }
        function initQuiz() { shuffledQuestions = shuffleArray(QUESTIONS); currentIndex = 0; score = 0; loadQuestion(); }
        function loadQuestion() {
            answered = false; document.getElementById('next-btn').disabled = true;
            const q = shuffledQuestions[currentIndex];
            document.getElementById('question-text').textContent = q.q;
            currentAnswers = shuffleArray([...q.w, q.c]);
            const container = document.getElementById('answers'); container.innerHTML = '';
            currentAnswers.forEach((answer, index) => {
                const btn = document.createElement('button'); btn.className = 'answer-btn'; btn.textContent = answer;
                btn.onclick = () => selectAnswer(index); container.appendChild(btn);
            });
            updateUI();
            const progress = ((currentIndex + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }
        function selectAnswer(index) {
            if (answered) return; answered = true;
            const q = shuffledQuestions[currentIndex]; const selected = currentAnswers[index];
            const isCorrect = selected === q.c; if (isCorrect) score++;
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (currentAnswers[i] === q.c) btn.classList.add('correct');
                else if (i === index && !isCorrect) btn.classList.add('wrong');
            });
            document.getElementById('score').textContent = `${i18n[lang].score}: ${score}`;
            document.getElementById('next-btn').disabled = false;
        }
        function nextQuestion() {
            if (currentIndex < shuffledQuestions.length - 1) { currentIndex++; loadQuestion(); }
            else { document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('results-screen').classList.remove('hidden'); showResults(); }
        }
        function showResults() {
            const pct = Math.round((score / shuffledQuestions.length) * 100);
            document.getElementById('result-score').textContent = `${score} / ${shuffledQuestions.length}`;
            document.getElementById('result-percent').textContent = `${pct}%`;
            const t = i18n[lang]; let msg, cls;
            if (pct >= 90) { msg = t.excellent; cls = 'excellent'; }
            else if (pct >= 70) { msg = t.good; cls = 'good'; }
            else if (pct >= 50) { msg = t.ok; cls = 'ok'; }
            else { msg = t.bad; cls = 'bad'; }
            const msgEl = document.getElementById('result-message'); msgEl.textContent = msg; msgEl.className = 'results-message ' + cls;
        }
        function restartQuiz() { document.getElementById('results-screen').classList.add('hidden'); document.getElementById('quiz-screen').classList.remove('hidden'); initQuiz(); }
        initQuiz();
    </script>
</body>
</html>
